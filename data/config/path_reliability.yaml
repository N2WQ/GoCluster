# Purpose: Path-reliability ingestion, sample floors, receiver contribution caps, decay, weights, thresholds, and glyphs.
# Ownership: mixed operator policy and algorithm calibration.
# Runtime behavior: Required feature-root config loaded from the active config directory at startup.
# Safe edits: Limit routine edits to enable/display, allowed bands, sample-floor policy, receiver-cap mode, and glyphs; retune calibration only with field evidence and validation.
# Source: data/config/README.md.
#
# Routine operator policy is limited to enable/display behavior, allowed bands,
# global sample-floor policy, receiver contribution mode, and glyph characters.
# Decay, weights, thresholds, mode offsets, merge rules, and noise tables are
# algorithm calibration. Do not retune those under normal operation without
# validation and decision-memory handling.

# Path reliability tuning
# This feature uses a single combined FT8-equivalent dB bucket family.
# It ingests FT8/FT4/CW/RTTY/PSK/WSPR into the same bucket set.
# Voice modes (LSB/USB) are display-only and never ingested.
# The glyph reflects the p50 SNR of selected, decayed path evidence adjusted for
# the user's noise class.
# Internally, SNRs are retained in fixed-width histogram bins; active glyphs and
# PATH filters compare the selected p50 bin against the thresholds below.
#
# Glyph scale (configured via glyph_symbols):
#   high/medium/low/unlikely map to bucket p50 evidence; insufficient and
#   closed use their own placeholders.

# Master enable for path reliability (set false to disable ingestion/display entirely).
enabled: true

# Bands allowed to contribute to path reliability buckets (normalized).
# Defaults to HF through 6m; exclude VHF/UHF unless explicitly listed.
allowed_bands:
  - 160m
  - 80m
  - 60m
  - 40m
  - 30m
  - 20m
  - 17m
  - 15m
  - 12m
  - 10m
  - 6m

# Glyph symbols (single printable ASCII character each).
glyph_symbols:
  high: ">"
  medium: "="
  low: "<"
  unlikely: "-"
  insufficient: " "
  closed: "#"

# Optional VOACAP fallback. When enabled, it can replace insufficient bucket
# predictions only with a closed glyph or a sparse-p50 glyph whose class agrees
# with the cached current-hour VOACAP forecast. Runtime VOACAP forecasts are
# bidirectional; lookup blends DX->user receive and user->DX transmit using the
# merge weights below, then applies the request user's receive-side noise
# penalty to the receive leg.
voacap_fallback:
  enabled: true
  ssn_fetch_interval_seconds: 1800
  ssn_request_timeout_seconds: 30
  ssn_ewma_half_life_seconds: 28800
  recompute_delta_percent: 12
  voacap_home: "C:\\itshfbc"
  voacap_timeout_seconds: 30
  forecast_hours: 8
  # Max time a single-band SHOW PROP waits for a command-triggered refresh; 0 enqueues without waiting.
  show_prop_wait_milliseconds: 750
  center_frequencies_mhz:
    - 3.75
    - 5.37
    - 7.15
    - 10.13
    - 14.18
    - 18.12
    - 21.23
    - 24.94
    - 28.85
  # Delay fallback so fresh cluster observations have time to populate buckets.
  delay_seconds: 600
  cache_ttl_seconds: 28800
  max_cache_entries: 50000
  max_delay_entries: 50000
  max_queue_depth: 1000
  worker_count: 1
  output_name_prefix: "gocluster_voacap_path"
  # Enable REL-gated ordinary VOACAP glyphs only after cached current-hour VOACAP exists.
  # Closed fallback still uses only the FT8-equivalent SNR50 closed threshold.
  reliability_gated_open_enabled: true
  # Allow sparse p50 to upgrade by one glyph tier when VOACAP is stronger and REL passes.
  reliability_sparse_upgrade_enabled: true
  # VOACAP REL gates are reliability of the configured request SNR, not direct class probabilities.
  # Stronger displayed classes require stronger REL evidence.
  reliability_min_high: 0.90
  reliability_min_medium: 0.80
  reliability_min_low: 0.65
  reliability_min_unlikely: 0.50
  # Sparse/no-p50 diagnostics include no usable p50 plus insufficient p50 evidence at or below this selected observation count. This does not change glyph decisions.
  sparse_p50_diagnostic_max_observation_count: 2

# Decay half-life in seconds when no per-band override applies.
default_half_life_seconds: 420

# Per-band half-life overrides (seconds). Omit or set 0 to use default_half_life_seconds.
band_half_life_seconds:
  160m: 600
  80m:  600
  60m:  540
  40m:  480
  30m:  420
  20m:  360
  17m:  300
  15m:  300
  12m:  240
  10m:  240
  6m:   240

# Buckets older than this many seconds are purged to bound memory (fallback only).
stale_after_seconds: 1800

# Stale window multiplier: stale_after = k * band half-life (per band).
stale_after_half_life_multiplier: 3

# Maximum age for selected prediction evidence, as a multiple of band half-life.
# 0 disables this freshness gate. Evidence older than this returns insufficient
# rather than decaying into weaker glyph tiers from age alone.
max_prediction_age_half_life_multiplier: 1.5

# Minimum decayed scalar evidence weight required to report a glyph; below this returns glyph_symbols.insufficient.
# Fine/coarse blends use the larger overlapping layer for scalar mass, not fine+coarse.
min_effective_weight: 0.5

# Minimum raw selected observations required to report a glyph; below this returns glyph_symbols.insufficient.
# Receiver-cap enforce mode applies receiver diversity as a separate gate so this count keeps one meaning.
min_observation_count: 21

# Minimum raw DX->user receive-leg observations required to report a beacon glyph.
# Beacon transmit evidence is not applicable, so this floor is calibrated per direction.
beacon_min_observation_count: 11

# Receiver contribution caps limit how much one receiving station can add to a
# bucket's trust evidence. "enforce" gates glyphs and PATH filters on capped
# evidence; "shadow" uses raw active evidence while recording whether the active
# cap would block; "off" disables capped tracking.
receiver_contribution_mode: enforce
receiver_fine_slots: 6              # Receiver slots retained in fine buckets.
receiver_coarse_slots: 12           # Receiver slots retained in coarse buckets.
receiver_max_effective_count: 8     # Max decayed effective observation count one receiver can contribute per bucket.
receiver_max_effective_weight: 8.0  # Max capped effective weight one receiver can contribute per bucket.

# Minimum fine weight required before blending fine with coarse (res-1); below this uses coarse only.
# In the blend band, p50 bins keep local emphasis while scalar weight uses union semantics.
min_fine_weight: 5

# Minimum fine weight required to use fine only (skip coarse entirely).
fine_only_weight: 20

# Reverse-direction hint discount applied to effective weight when one direction is missing.
reverse_hint_discount: 0.5

# Merge weights for combining receive/transmit FT8-equiv dB values (normalized to sum to 1).
# receive = DX->user (after configured noise penalty, if any), transmit = user->DX.
merge_receive_weight: 0.6
merge_transmit_weight: 0.4

# Per-mode glyph thresholds in FT8-equivalent dB.
# FT8 thresholds follow: >= -13 high, -17..-13 medium, -21..-17 low,
# below -21 unlikely for bucket predictions, and <= -29 closed for VOACAP.
# CW/RTTY/PSK thresholds derive from 0/3/7/12 dB buckets with a -7 dB correction.
# Repeated threshold keys mean: high >= high, medium >= medium, low >= low,
# unlikely >= unlikely; VOACAP closed fallback uses closed <= closed.
mode_thresholds:
  ft8:
    high: -13
    medium: -17
    low: -21
    unlikely: -24
    closed: -29
  ft4:
    high: -5
    medium: -10
    low: -14
    unlikely: -17
    closed: -22
  cw:
    high: -1
    medium: -6
    low: -10
    unlikely: -14
    closed: -19
  rtty:
    high: -1
    medium: -6
    low: -10
    unlikely: -14
    closed: -19
  psk:
    high: 5
    medium: 0
    low: -4
    unlikely: -7
    closed: -12
  usb:
    high: 10
    medium: 5
    low: 0
    unlikely: -5
    closed: -10
  lsb:
    high: 10
    medium: 5
    low: 0
    unlikely: -5
    closed: -10

# Fallback glyph thresholds in FT8-equivalent dB (used when a mode is missing above).
glyph_thresholds:
  high: -13
  medium: -17
  low: -21
  unlikely: -24
  closed: -29

# Cap per-beacon contribution so a single beacon cannot dominate.
beacon_weight_cap: 1.0

# Toggle glyph rendering in telnet output.
display_enabled: true

# Mode offsets to convert to FT8-equivalent dB (applied on ingest).
mode_offsets:
  ft4: 0    # FT4 reports use no offset before FT8-equivalent aggregation.
  cw: -7    # CW reports are shifted into FT8-equivalent dB.
  rtty: -7  # RTTY reports are shifted into FT8-equivalent dB.
  psk: -19  # PSK reports are shifted into FT8-equivalent dB.
  wspr: 0   # WSPR reports are shifted into FT8-equivalent dB.

# Receive-side noise penalties for SET NOISE.
# Values are dB subtracted from DX->user path evidence at prediction time.
noise_offsets:
  quiet: 0
  rural: 4
  suburban: 12
  urban: 17
  industrial: 20
