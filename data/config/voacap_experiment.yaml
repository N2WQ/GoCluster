# Purpose: Controls the manual VOACAP SSN forecast experiment.
# Ownership: algorithm calibration.
# Runtime behavior: Optional tool config; ignored by server startup and loaded strictly by voacap_ssn_forecast_watch.
# Safe edits: Change only for VOACAP experiments with run evidence; do not treat these values as production path-reliability settings.
# Source: data/config/README.md.

# Poll cadence for NOAA SWPC sunspot_report.json.
ssn_fetch_interval_seconds: 1800

# HTTP timeout for one NOAA fetch attempt.
ssn_request_timeout_seconds: 30

# Half-life for smoothing fresh SSN observations before forecast decisions.
ewma_half_life_seconds: 28800

# Relative EWMA change from the last successful forecast that triggers VOACAP.
recompute_delta_percent: 12

# Local ITSHFBC/VOACAP installation root.
voacap_home: "C:\\itshfbc"

# Hard timeout for one VOACAP process invocation.
voacap_timeout_seconds: 30

# Number of forecast hours emitted by the baseline experiment deck.
forecast_hours: 8

# Center frequencies in MHz; VOACAP supports up to ten fixed-width slots.
center_frequencies_mhz:
  - 3.75
  - 5.37
  - 7.15
  - 10.13
  - 14.18
  - 18.12
  - 21.23
  - 24.94
  - 28.85

# Persisted observer state used to suppress stale observations and repeated forecasts.
state_path: ".tmp/voacap-ssn-forecast-state.json"

# Prefix for output files written in the VOACAP run directory.
output_name_prefix: "gocluster_voacap_forecast"
