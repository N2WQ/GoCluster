# Purpose: DXSpider peer links, local peer identity, ACLs, queue bounds, and forwarding policy.
# Ownership: deployment/runtime settings plus operator policy.
# Runtime behavior: Required merged runtime config loaded from the active config directory at startup.
# Safe edits: Put real peer hosts, callsigns, and passwords only in private config; validate receive/forwarding policy after restart.
# Source: data/config/README.md.

peering:
  enabled: false                   # Enable DXSpider peering (PC11/PC61/PC92/PC51)
  max_peers: 64                    # Required maximum enabled direct identities, integer 1-64; restart to change
  forward_spots: false             # Peer spot data-plane forwarding; false = receive-only except local DX posts
  local_callsign: "N0CALL-1"       # Our node callsign sent in PC92/PC19 frames
  listen_port: 6300                # Optional inbound listen port for peers
  hop_count: 99                    # Hop limit we advertise and decrement on forward
  node_version: "5457"             # Numeric protocol compatibility version (1-10 digits), separate from GoCluster identity
  node_build: "633"                # Numeric compatibility build (1-10 digits); explicit empty string omits it
  legacy_version: "5401"           # Legacy PC19 version string
  pc92_bitmap: 5                   # Capabilities bitmap in PC92 entries
  node_count: 1                    # Legacy fallback only; PC92 K derives the actual published direct population
  user_count: 1                    # Legacy fallback only; PC92 K derives current publishable telnet sessions
  log_keepalive: false             # Emit PC51 keepalive chatter to the console
  log_line_too_long: false         # Log and drop oversized peer lines
  telnet_transport: "native"       # Telnet parser/negotiation backend: native or ziutek
  keepalive_seconds: 600           # Periodic PC92 K/PC51 interval; 0 disables this timer, not recovery
  config_seconds: 1800             # Periodic PC92 C interval; 0 disables this timer, not mandatory recovery C/A
  write_queue_size: 128            # Normal queued record ceiling; the independent physical byte budget can win first
  max_line_length: 65536           # Peer wire ceiling, at most 65536 when enabled; smaller limits remain effective
  pc92_max_bytes: 65536            # PC92 wire ceiling <= max_line_length; a complete local snapshot must fit
  # Repeated peer entries use the field meanings shown on the first example row.
  peers:
    - enabled: false               # Example peer #1 (set true only after editing)
      family: "dxspider"           # Peer family: dxspider or ccluster
      direction: "both"            # Allow outbound dial and inbound accept
      host: "peer1.example.invalid" # Remote host
      port: 7300                   # Remote port
      password: ""                 # Optional password sent after login callsign
      prefer_pc9x: true            # Prefer PC9x (PC92/PC61) over legacy PC19/PC11
      login_callsign: "N0CALL-1"   # Callsign used to log in to the remote
      remote_callsign: "N0PEER-1"  # Expected remote node callsign
    - enabled: false
      family: "dxspider"
      direction: "both"
      host: "peer2.example.invalid"
      port: 7300
      password: ""
      prefer_pc9x: true
      login_callsign: "N0CALL-1"
      remote_callsign: "N0PEER-2"
    - enabled: false
      family: "dxspider"
      direction: "both"
      host: "peer3.example.invalid"
      port: 6300
      password: ""
      prefer_pc9x: true
      login_callsign: "N0CALL-1"
      remote_callsign: "N0PEER-3"
    - enabled: false
      family: "dxspider"
      direction: "both"
      host: "peer4.example.invalid"
      port: 7300
      password: ""
      prefer_pc9x: true
      login_callsign: "N0CALL-1"
      remote_callsign: "N0PEER-4"
    - enabled: false
      family: "dxspider"
      direction: "both"
      host: "peer5.example.invalid"
      port: 7300
      password: ""
      prefer_pc9x: true
      login_callsign: "N0CALL-1"
      remote_callsign: "N0PEER-5"
    - enabled: false
      family: "dxspider"
      direction: "both"
      host: "peer6.example.invalid"
      port: 7373
      password: ""
      prefer_pc9x: true
      login_callsign: "N0CALL-1"
      remote_callsign: "N0PEER-6"
    - enabled: false
      family: "dxspider"
      direction: "both"
      host: "peer7.example.invalid"
      port: 7373
      password: ""
      prefer_pc9x: true
      login_callsign: "N0CALL-1"
      remote_callsign: "N0PEER-7"
  timeouts:
    login_seconds: 60              # Outbound login timeout
    init_seconds: 60               # Outbound init/handshake timeout
    idle_seconds: 600              # Idle read deadline before reconnect
  backoff:
    base_ms: 2000                  # Reconnect backoff base (ms)
    max_ms: 300000                 # Reconnect backoff max (ms)
  topology:
    db_path: ""                    # Optional topology SQLite path (empty disables)
    retention_hours: 24            # Retention window for topology records
    persist_interval_seconds: 300  # How often to persist topology to disk
  acl:
    allow_ips: []                  # Optional inbound allowlist (CIDRs)
    allow_callsigns: []            # Optional inbound callsign allowlist
