# Purpose: Canonical supported MODE tokens, EVENT families, and PSKReporter routing.
# Ownership: reference table plus limited operator policy.
# Runtime behavior: Required reference table loaded from the active config directory at startup and not hot-reloaded.
# Safe edits: Add modes/events only by selecting behavior families already implemented by the binary; restart with the matching binary/config directory.
# Source: data/config/README.md.
#
# Canonical spot taxonomy for modes and EVENT families.
# This is a required reference table. It is read at startup from the active
# config directory and is not reloaded while the process is running.
#
# Operators may add modes or EVENT families here, but new entries can only opt
# into behavior families that the binary already knows how to handle. YAML
# cannot define new parsers, transports, distance models, archive engines, or
# EVENT grammars beyond the token/prefix matchers below.
#
# Mode field guide:
# - name/display: canonical token and user-facing text.
# - filter_visible/default_filter_allowed/cc_shortcut: command/filter surface.
# - comment_tokens/variants/blank_mode_token/synthetic: parser aliases.
# - pskreporter_route: normal, path_only, or ignore.
# - mode_inference_seed/voice_by_frequency: mode-inference participation.
# - ft_dial_canonicalization: canonicalize FT dial frequencies where supported.
# - ft_confidence.enabled: include mode in bounded FT burst confidence handling.
# - quiet_gap_seconds_key/hard_cap_seconds_key: keys into pipeline.yaml FT burst timing.
# - report_format: archive report parsing.
# - bare_numeric_report: allow signed numeric report parsing without explicit dB token.
# - confidence_filter_exempt: bypass confidence filters for modes where confidence is not meaningful.
# - call_correction_profile/frequency_averaging/source_skew_correction:
#   correction-pipeline capability flags.
# - custom_scp_bucket/path_reliability_*: retained support and path bucket mapping.
#
# EVENT field guide:
# - standalone_tokens: exact comment tokens such as POTA.
# - reference_prefixes: acronym-prefixed references such as POTA-1234.
# - reference_suffix: supported suffix matcher; currently alnum_hyphen.
modes:
  - name: CW
    display: CW
    filter_visible: true
    default_filter_allowed: true
    cc_shortcut: true
    comment_tokens: [CW, CWT]
    pskreporter_route: normal
    path_reliability_ingest: true
    report_format: plain_db
    bare_numeric_report: true
    source_skew_correction: true
    call_correction_profile: standard
    frequency_averaging: true
    custom_scp_bucket: cw
    path_reliability_bucket: CW
    path_reliability_offset_mode: CW

  - name: SSB
    display: SSB
    filter_visible: false
    comment_tokens: [SSB]
    voice_by_frequency: true
    path_reliability_bucket: SSB
    path_reliability_offset_mode: SSB

  - name: USB
    display: USB
    filter_visible: true
    default_filter_allowed: true
    comment_tokens: [USB]
    call_correction_profile: voice
    custom_scp_bucket: voice
    path_reliability_bucket: SSB
    path_reliability_offset_mode: SSB

  - name: LSB
    display: LSB
    filter_visible: true
    default_filter_allowed: true
    comment_tokens: [LSB]
    call_correction_profile: voice
    custom_scp_bucket: voice
    path_reliability_bucket: SSB
    path_reliability_offset_mode: SSB

  - name: RTTY
    display: RTTY
    filter_visible: true
    default_filter_allowed: true
    cc_shortcut: true
    comment_tokens: [RTTY]
    pskreporter_route: normal
    path_reliability_ingest: true
    report_format: plain_db
    bare_numeric_report: true
    source_skew_correction: true
    call_correction_profile: standard
    frequency_averaging: true
    custom_scp_bucket: rtty
    path_reliability_bucket: RTTY
    path_reliability_offset_mode: RTTY

  - name: FT8
    display: FT8
    filter_visible: true
    cc_shortcut: true
    comment_tokens: [FT8, FT-8]
    pskreporter_route: normal
    path_reliability_ingest: true
    mode_inference_seed: true
    ft_dial_canonicalization: true
    ft_confidence:
      enabled: true
      quiet_gap_seconds_key: ft8_quiet_gap_seconds
      hard_cap_seconds_key: ft8_hard_cap_seconds
    report_format: signed_db
    bare_numeric_report: true
    custom_scp_bucket: ft8
    path_reliability_bucket: FT8
    path_reliability_offset_mode: FT8

  - name: FT4
    display: FT4
    filter_visible: true
    cc_shortcut: true
    comment_tokens: [FT4, FT-4]
    pskreporter_route: normal
    path_reliability_ingest: true
    mode_inference_seed: true
    ft_dial_canonicalization: true
    ft_confidence:
      enabled: true
      quiet_gap_seconds_key: ft4_quiet_gap_seconds
      hard_cap_seconds_key: ft4_hard_cap_seconds
    report_format: signed_db
    bare_numeric_report: true
    custom_scp_bucket: ft4
    path_reliability_bucket: FT4
    path_reliability_offset_mode: FT4

  - name: FT2
    display: FT2
    filter_visible: true
    cc_shortcut: true
    comment_tokens: [FT2, FT-2]
    pskreporter_route: normal
    ft_dial_canonicalization: true
    ft_confidence:
      enabled: true
      quiet_gap_seconds_key: ft2_quiet_gap_seconds
      hard_cap_seconds_key: ft2_hard_cap_seconds
    report_format: signed_db
    custom_scp_bucket: ft2

  - name: MSK144
    display: MSK144
    filter_visible: true
    comment_tokens: [MSK, MSK144, MSK-144]
    pskreporter_route: normal
    confidence_filter_exempt: true
    bare_numeric_report: true

  - name: PSK
    display: PSK
    filter_visible: true
    comment_tokens: [PSK]
    variants: [PSK31, PSK63, PSK125]
    pskreporter_route: normal
    path_reliability_ingest: true
    confidence_filter_exempt: true
    path_reliability_bucket: PSK
    path_reliability_offset_mode: PSK

  - name: JS8
    display: JS8
    filter_visible: true
    comment_tokens: [JS8]
    mode_inference_seed: true

  - name: SSTV
    display: SSTV
    filter_visible: true
    comment_tokens: [SSTV]

  - name: WSPR
    display: WSPR
    filter_visible: false
    comment_tokens: [WSPR]
    pskreporter_route: path_only
    path_reliability_ingest: true
    path_reliability_bucket: WSPR
    path_reliability_offset_mode: WSPR

  - name: UNKNOWN
    display: UNKNOWN
    synthetic: true
    filter_visible: true
    default_filter_allowed: true
    blank_mode_token: true

events:
  - name: LLOTA
    display: LLOTA
    filter_visible: true
    standalone_tokens: [LLOTA]
    reference_prefixes: [LLOTA-]
    reference_suffix: alnum_hyphen

  - name: IOTA
    display: IOTA
    filter_visible: true
    standalone_tokens: [IOTA]
    reference_prefixes: [IOTA-]
    reference_suffix: alnum_hyphen

  - name: POTA
    display: POTA
    filter_visible: true
    standalone_tokens: [POTA]
    reference_prefixes: [POTA-]
    reference_suffix: alnum_hyphen

  - name: SOTA
    display: SOTA
    filter_visible: true
    standalone_tokens: [SOTA]
    reference_prefixes: [SOTA-]
    reference_suffix: alnum_hyphen

  - name: WWFF
    display: WWFF
    filter_visible: true
    standalone_tokens: [WWFF]
    reference_prefixes: [WWFF-]
    reference_suffix: alnum_hyphen
