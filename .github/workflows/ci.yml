name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Add installed Go tools to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check GitHub Actions workflows
        run: actionlint .github/workflows/*.yml

      - name: Check code maps
        run: go run ./cmd/codemap check -all

      - name: Run unit tests
        run: go test ./...

      - name: Run connected Custom SCP regression
        shell: bash
        run: |
          set -euo pipefail
          fixture_root=$(mktemp -d "${RUNNER_TEMP}/customscp.XXXXXX")
          export GOCLUSTER_CUSTOMSCP_FIXTURE="$fixture_root"
          export GOCLUSTER_CUSTOMSCP_RUN_ID="${fixture_root##*/}"
          # A renamed or excluded test must fail instead of matching no tests.
          go test -list '^TestCustomSCPCleanupFixtureProducer$' ./spot | grep -Fx 'TestCustomSCPCleanupFixtureProducer'
          go test -list '^TestCustomSCPDeliveredOutput$' ./internal/cluster | grep -Fx 'TestCustomSCPDeliveredOutput'
          # Separate processes share this run's database; the producer must finish first.
          go test -count=1 -timeout=2m -v -run '^TestCustomSCPCleanupFixtureProducer$' ./spot
          go test -count=1 -timeout=2m -v -run '^TestCustomSCPDeliveredOutput$' ./internal/cluster

      - name: Run go vet
        run: go vet ./...

      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Run Staticcheck
        run: staticcheck ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Run golangci-lint
        run: golangci-lint run ./... --config=.golangci.yaml

      - name: Check pushed range for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              echo "A non-zero pre-push revision is required for a push to main." >&2
              exit 1
            fi
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
                echo "Unable to fetch pre-push revision $BEFORE_SHA." >&2
                exit 1
              fi
            fi
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "Unable to resolve pre-push revision $BEFORE_SHA." >&2
              exit 1
            fi
            base="$BEFORE_SHA"
          else
            if ! git rev-parse --verify "HEAD^" >/dev/null 2>&1; then
              echo "workflow_dispatch requires the checked-out commit to have a parent." >&2
              exit 1
            fi
            base="HEAD^"
            AFTER_SHA="HEAD"
          fi
          git diff --check "$base" "$AFTER_SHA" --

  windows-product:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify native compiler and run Windows product tests
        shell: pwsh
        run: |
          if ((go env CGO_ENABLED) -ne '1') { throw 'Native CGO is required for Windows race qualification.' }
          gcc --version
          if ($LASTEXITCODE) { throw 'Native Windows C compiler unavailable.' }
          ./scripts/test-windows.ps1
          ./scripts/test-test-windows.ps1
      - name: Run command oracles and source-bound integration
        shell: pwsh
        run: |
          python -m venv .tmp/telnet-test-venv
          if ($LASTEXITCODE) { throw 'Python environment creation failed.' }
          $python = '.tmp/telnet-test-venv/Scripts/python.exe'
          & $python -m pip install PyYAML==6.0.3
          if ($LASTEXITCODE) { throw 'Pinned dependency installation failed.' }
          & $python -m unittest discover -s scripts -p 'test*_test.py'
          if ($LASTEXITCODE) { throw 'Command oracle tests failed.' }
          & $python scripts/test-command-fixes.py
          if ($LASTEXITCODE) { throw 'Source-bound command qualification failed.' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-command-receipts
          path: .tmp/command-fixes/**
          retention-days: 7

  maintained-modules:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test maintained forks and bounded SQLite interoperability
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ((go env CGO_ENABLED) -ne '1') { throw 'Native CGO is required.' }
          gcc --version
          if ($LASTEXITCODE) { throw 'Native C compiler unavailable.' }
          go -C third_party/go-sqlite3/engine build ./...
          if ($LASTEXITCODE) { throw 'SQLite engine build failed.' }
          $groups = @(
            @{ root='third_party/go-sqlite3'; package='./...'; tags=''; names=@() },
            @{ root='third_party/go-sqlite3/qualification'; package='.'; tags='sqlite3_qualification'; names=@('TestV15SQLiteWALProcessLocksAndCoherence','TestV15SQLiteWALMultipleIndexPages','TestV15SQLiteWALCrashAndReopen','TestV15SQLiteWALLiveWriterReadProbes') },
            @{ root='third_party/paho.mqtt.golang'; package='.'; tags=''; names=@('TestMatchAndDispatchWorkerPoolAllowsParallel','TestEnqueueInboundPublishDropsQoS0WhenFull','TestEnqueueInboundPublishTimesOutQoS12WhenFull','TestEnqueueInboundPublishOkWhenSpace','TestCustomConnectionFunction','TestGetBackoffSleepTime') },
            @{ root='third_party/paho.mqtt.golang'; package='./packets'; tags=''; names=@() }
          )
          foreach ($race in @($false, $true)) {
            foreach ($group in $groups) {
              $run = if ($group.names.Count) { '^(' + ($group.names -join '|') + ')$' } else { '' }
              $package = go -C $group.root list "-tags=$($group.tags)" .
              if ($LASTEXITCODE) { throw 'Module package identity failed.' }
              $required = @($group.names | ForEach-Object { "${package}::$_" })
              if ($IsWindows) {
                ./scripts/test-windows.ps1 -ModuleRoot $group.root -Packages $group.package -Tags $group.tags -Run $run -RequireCases $required -Race:$race
              } else {
                $arguments = @('-C', $group.root, 'test', '-count=1', '-timeout=10m', '-json')
                if ($race) { $arguments += '-race' }
                if ($group.tags) { $arguments += @('-tags', $group.tags) }
                if ($run) { $arguments += @('-run', $run) }
                $started = [Collections.Generic.Dictionary[string,bool]]::new([StringComparer]::Ordinal)
                $passed = [Collections.Generic.Dictionary[string,bool]]::new([StringComparer]::Ordinal)
                & go @arguments $group.package | ForEach-Object {
                  $event = $_ | ConvertFrom-Json -ErrorAction Stop
                  if ($event -isnot [pscustomobject] -or $event.Package -isnot [string] -or $event.Action -isnot [string] -or
                      ($event.PSObject.Properties['Test'] -and $event.Test -isnot [string])) { throw 'Malformed module test event identity.' }
                  if ($event.Test) {
                    $identity = "$($event.Package)::$($event.Test)"
                    if ($event.Action -ceq 'run') { $started[$identity] = $true }
                    if ($event.Action -ceq 'pass' -and $started.ContainsKey($identity)) { $passed[$identity] = $true }
                  }
                  Write-Host $_
                }
                if ($LASTEXITCODE) { throw 'Maintained module tests failed.' }
                foreach ($identity in $required) { if (-not $passed.ContainsKey($identity)) { throw "Missing required RUN/PASS: $identity" } }
              }
            }
          }
