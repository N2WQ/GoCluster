name: Nightly Race

on:
  schedule:
    # 07:17 UTC avoids the beginning-of-hour scheduling peak.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race suite
        run: go test -race -count=1 ./...

      - name: Run connected Custom SCP race regression
        shell: bash
        run: |
          set -euo pipefail
          fixture_root=$(mktemp -d "${RUNNER_TEMP}/customscp.XXXXXX")
          export GOCLUSTER_CUSTOMSCP_FIXTURE="$fixture_root"
          export GOCLUSTER_CUSTOMSCP_RUN_ID="${fixture_root##*/}"
          # Select from the same race build that will execute each stage.
          go test -race -list '^TestCustomSCPCleanupFixtureProducer$' ./spot | grep -Fx 'TestCustomSCPCleanupFixtureProducer'
          go test -race -list '^TestCustomSCPDeliveredOutput$' ./internal/cluster | grep -Fx 'TestCustomSCPDeliveredOutput'
          # Separate processes share this run's database; the producer must finish first.
          go test -race -count=1 -timeout=2m -v -run '^TestCustomSCPCleanupFixtureProducer$' ./spot
          go test -race -count=1 -timeout=2m -v -run '^TestCustomSCPDeliveredOutput$' ./internal/cluster
